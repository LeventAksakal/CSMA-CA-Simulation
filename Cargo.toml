[package]
name = "csma-ca-simulation"
version = "0.1.0"
edition = "2024"
description = "Rust-first CSMA/CA simulator with CLI-driven experiments"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.28.1"
csv = "1.4.0"
plotters = "0.3.7"
rand = "0.10.1"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[features]
rayon = ["dep:rayon"]
