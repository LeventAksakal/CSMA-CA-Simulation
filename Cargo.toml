[package]
name = "csma-ca-simulation"
version = "0.1.0"
edition = "2024"
description = "Rust-first CSMA/CA simulator with CLI-driven experiments"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
plotters = "0.3.7"
rand = "0.10.1"
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }

[features]
rayon = ["dep:rayon"]
